<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Arial, sans-serif;
          background: linear-gradient(to bottom, #535353 0%, #2E2E2E 200px, #121212 400px);
          min-height: 100vh;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        background: #464545;
        max-width: 500px;
        margin: 24px;
        padding: 50px 40px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    .avatar {
        width: 90px;
        height: 90px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6c8cff, #8b6cff);
        color: #fff;
        font-size: 2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    h1 {
        font-size: 1.9rem;
        color: #fff;
        margin-bottom: 6px;
    }

    .tagline {
        color: #a8a7a7;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 20px;
    }

    .about {
        color: #ffffff;
        font-size: 1rem;
        line-height: 1.7;
    }

    .divider {
        width: 50px;
        height: 4px;
        background: linear-gradient(90deg, #0000, #0000);
        border-radius: 2px;
        margin: 0 auto 20px;
    }

      .icon-link {
        display: inline-block;
        padding: 2px 8px;
        margin: 2px;
        background: #7e7d7d;
        color: #ffffff;
        text-decoration: none;
        border-radius: 50px;
        font-size: 0.65rem;
        font-weight: 600;
        transition: transform 0.2s, background 0.2s;
    }

    .icon-link:hover {
        background: #0a0a0a;
        transform: translateY(-3px);
    }

</style>
<base target="blank">
</head>
<body>

<div class="card">
    <img
        src="spidey.jpg"
        alt="Joash Mathew Profile Picture"
        class="avatar"
      />
    <h1>ASCHE</h1>
    <p class="tagline">Student x Developer</p>
      <div class="divider"></div>
    <p class="about">
        Hello! I'm Joash. I am passionate about learning new things. This is my small portfolio page —
        cas inspired!
    </p>
      <div class="divider"></div>
    <div class="social-links">
    <a href="https://www.facebook.com/asche.fiesholt/" class="icon-link" >Facebook</a>
    <a href="https://www.instagram.com/jshmthw.d" class="icon-link">Instagram</a>
   
</div>
</div>


</body>
</html>
